name: NDIViewer
options:
  bundleIdPrefix: com.czior
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  NDIViewer:
    type: application
    platform: macOS
    sources:
      - path: NDIViewer
        excludes:
          - "Web/**"
          - "Support/Info.plist"
      - path: NDIViewer/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: NDI-Viewer
        PRODUCT_BUNDLE_IDENTIFIER: com.czior.NDIViewer
        INFOPLIST_FILE: NDIViewer/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: NDIViewer/Support/NDIViewer-Bridging-Header.h
        HEADER_SEARCH_PATHS: "\"/Library/NDI SDK for Apple/include\""
        LIBRARY_SEARCH_PATHS: "\"/Library/NDI SDK for Apple/lib/macOS\""
        OTHER_LDFLAGS: "-lndi"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
    postBuildScripts:
      - name: Embed libndi
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DEST"
          cp -f "/Library/NDI SDK for Apple/lib/macOS/libndi.dylib" "$DEST/"
          codesign --force --sign - "$DEST/libndi.dylib"
